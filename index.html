<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      console.log(`%c --运行环境:${process.env.NODE_ENV||'production'}--`,'color:red;font-size:20px;line-height:30px;text-align:center;');
      const meta = document.createElement('meta');
      
      // ! process 通过 预加载插件注入到全局变量中

      // 特性   |	script-src 'self' 'unsafe-inline' |	default-src 'self'; script-src 'self'
      // 是否允许内联脚本 |	是（unsafe-inline）|	否
      // 是否限制脚本加载的来源 |	是（只允许同源加载） |	是（只允许同源加载）
      // 是否对其他资源有默认策略限制 |	否 |	是（限制所有资源加载来源为同源）
      // 安全性 |	较低（可能存在 XSS 漏洞） |	较高（禁止内联脚本，减少攻击面）

      const content = process.env.NODE_ENV === 'development' ? "script-src 'self' 'unsafe-inline';" : "default-src 'self'; script-src 'self';";
      
      meta.setAttribute('http-equiv', 'Content-Security-Policy');
      meta.setAttribute('content',content);
      document.head.appendChild(meta);        
    </script>
  </body>
</html>
